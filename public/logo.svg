<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cœur 1 : Ambre Doré & Corail Chaleureux -->
    <linearGradient id="amber-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Cœur 2 : Rose Framboise & Magenta Électrique -->
    <linearGradient id="magenta-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fond Squircle App Store -->
  <rect width="100" height="100" rx="22" fill="#18181b" />

  <!-- Cœur 1 (Gauche - Ambre Doré & Corail) -->
  <g transform="translate(36, 48) rotate(-16) scale(0.66) translate(-50, -50)" filter="url(#shadow)">
    <path d="M 50,30 C 50,19 40,13 30,13 C 18,13 10,22 10,36 C 10,54 30,69 50,87 C 70,69 90,54 90,36 C 90,22 82,13 70,13 C 60,13 50,19 50,30 Z" fill="url(#amber-coral)" />
  </g>

  <!-- Cœur 2 (Droit - Rose Framboise & Magenta avec bordure de découpe nette) -->
  <g transform="translate(64, 52) rotate(16) scale(0.66) translate(-50, -50)" filter="url(#shadow)">
    <path d="M 50,30 C 50,19 40,13 30,13 C 18,13 10,22 10,36 C 10,54 30,69 50,87 C 70,69 90,54 90,36 C 90,22 82,13 70,13 C 60,13 50,19 50,30 Z" fill="url(#magenta-rose)" stroke="#18181b" stroke-width="3.5" stroke-linejoin="round" />
  </g>
</svg>
