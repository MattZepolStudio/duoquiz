<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rose-grad" x1="15" y1="20" x2="65" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="coral-grad" x1="85" y1="20" x2="35" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#18181b" />
  <circle cx="50" cy="50" r="36" fill="url(#rose-grad)" opacity="0.18" filter="url(#glow)" />

  <g filter="url(#shadow)">
    <!-- Coeur Gauche (Rose Framboise) -->
    <path d="M 47,82 C 34,73 14,56 14,35 C 14,21 24,12 36,12 C 43,12 49,16 52,22 C 50,26 47,31 43,37 C 38,44 32,53 47,72 Z" fill="url(#rose-grad)" opacity="0.95" />

    <!-- Coeur Droit (Corail Vibrant) -->
    <path d="M 53,82 C 66,73 86,56 86,35 C 86,21 76,12 64,12 C 57,12 51,16 48,22 C 51,28 56,35 60,42 C 65,51 68,62 53,82 Z" fill="url(#coral-grad)" opacity="0.95" />

    <!-- Ruban d'entrelacement central -->
    <path d="M 36,12 C 43,12 48.5,17 50,23 C 51.5,17 57,12 64,12 C 72,12 80,18 82,27 C 76,27 68,29 60,36 C 53,42 47,52 42,63 C 35,51 24,38 24,28 C 24,19 29,12 36,12 Z" fill="url(#rose-grad)" />
    <path d="M 43,26 C 46.5,20 53.5,20 57,26 C 61,33 55,46 50,53 C 45,46 39,33 43,26 Z" fill="url(#coral-grad)" opacity="0.9" />

    <!-- Pointe de fusion -->
    <path d="M 50,86 C 47,82 43,76 39,69 C 45,74 55,74 61,69 C 57,76 53,82 50,86 Z" fill="#e11d48" />

    <!-- Reflets brillants -->
    <path d="M 23,24 C 23,17 29,14 36,14 C 40,14 43,16 46,19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 77,24 C 77,17 71,14 64,14 C 60,14 57,16 54,19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- Étincelle dorée au point de complicité -->
  <g transform="translate(50, 36)">
    <circle cx="0" cy="0" r="7" fill="#fef08a" opacity="0.4" filter="url(#glow)" />
    <path d="M 0,-8 Q 0.5,-1.5 5,-0.5 Q 0.5,0.5 0,8 Q -0.5,0.5 -5,-0.5 Q -0.5,-1.5 0,-8 Z" fill="url(#sparkle-grad)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    <circle cx="6.5" cy="-5.5" r="1" fill="#fef08a" opacity="0.9" />
    <circle cx="-5.5" cy="5.5" r="0.8" fill="#fb923c" opacity="0.8" />
  </g>
</svg>
