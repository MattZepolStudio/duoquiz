<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé Cœur 1 : Corail Pêche Chaleureux -->
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Dégradé Cœur 2 : Rose Framboise Électrique -->
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fond Squircle App Store -->
  <rect width="100" height="100" rx="22" fill="#18181b" />

  <!-- Cœur 1 (Partenaire gauche - Corail / Rose chaud) -->
  <g transform="translate(42, 47) rotate(-14) scale(0.65) translate(-50, -50)" filter="url(#shadow)">
    <path d="M 50,30 C 50,20 40,14 30,14 C 18,14 10,23 10,37 C 10,54 30,68 50,86 C 70,68 90,54 90,37 C 90,23 82,14 70,14 C 60,14 50,20 50,30 Z" fill="url(#coral)" opacity="0.9" />
  </g>

  <!-- Cœur 2 (Partenaire droit - Rose / Framboise) superposé -->
  <g transform="translate(58, 53) rotate(14) scale(0.65) translate(-50, -50)" filter="url(#shadow)">
    <path d="M 50,30 C 50,20 40,14 30,14 C 18,14 10,23 10,37 C 10,54 30,68 50,86 C 70,68 90,54 90,37 C 90,23 82,14 70,14 C 60,14 50,20 50,30 Z" fill="url(#rose)" opacity="0.92" />
  </g>

  <!-- Point de contact subtil -->
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>
